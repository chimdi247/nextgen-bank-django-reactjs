## Mounted at /etc/rabbitmq/conf.d/90-nextgen.conf
# Prometheus endpoint (:15692/metrics), scraped by observability/prometheus/prometheus.yml
prometheus.return_per_object_metrics = true     # per-queue series: messages ready / unacked by queue
prometheus.tcp.port = 15692
# do not crash the broker on a full disk in a dev machine, but alarm early
disk_free_limit.absolute = 500MB
