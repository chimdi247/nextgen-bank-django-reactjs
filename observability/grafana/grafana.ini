# Grafana UI configuration (mounted read-only at /etc/grafana/grafana.ini)
# $__env{X} values come from the `grafana` service environment in local.yml (env_file .envs/.env.local).
[server]
http_port = 3000
domain = localhost

[security]
admin_user = $__env{GF_SECURITY_ADMIN_USER}
admin_password = $__env{GF_SECURITY_ADMIN_PASSWORD}

[users]
default_theme = dark
allow_sign_up = false

[auth.anonymous]
# read-only viewer access so the links inside the admin console open without a login prompt
enabled = true
org_role = Viewer

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/nb-overview.json
min_refresh_interval = 5s

[analytics]
reporting_enabled = false
check_for_updates = false

[feature_toggles]
# trace <-> log <-> metric correlation UX
enable = traceToMetrics,tempoSearch,tempoServiceGraph,correlations

[unified_alerting]
enabled = true
execute_alerts = true
min_interval = 10s

[alerting]
enabled = false

# ---- SMTP used by Grafana-managed alert notifications (contact point "NextGen Bank Ops (email)")
[smtp]
enabled = true
host = $__env{SMTP_HOST}:$__env{SMTP_PORT}
user = $__env{SMTP_USER}
password = $__env{SMTP_PASSWORD}
from_address = $__env{SMTP_FROM_ADDRESS}
from_name = NextGen Bank Grafana Alerts
startTLS_policy = $__env{SMTP_STARTTLS_POLICY}
skip_verify = true
