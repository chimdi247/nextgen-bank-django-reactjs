upstream api {
    server api:8000;
}

log_format detailed_log '$remote_addr - $upstream_http_x_django_user - [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        '$request_time $upstream_response_time '
                        '"$http_x_forwarded_for" trace=$upstream_http_x_trace_id';

server {
    listen 80;

    client_max_body_size 20M;

    error_log /var/log/nginx/error.log error;

    # $http_host keeps the port (localhost:8080): Django builds absolute URLs / checks CSRF origins with it
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # W3C trace context from the browser (if any) is forwarded untouched
    proxy_pass_header X-Django-User;

    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- API
    location /api/v1/ {
        proxy_pass http://api;
        proxy_read_timeout 90s;
        access_log /var/log/nginx/api_access.log detailed_log;
    }

    # ---- Django admin (ADMIN_URL=supersecret/)
    location /supersecret {
        proxy_pass http://api;
        access_log /var/log/nginx/admin_access.log detailed_log;
    }

    # ---- collected static files (Django admin / DRF) and uploaded media (profile photos)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location /media/ {
        alias /app/media/;
        expires 1h;
    }

    # ---- liveness for the docker healthcheck / blackbox probe
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
    # basic connection metrics for debugging (internal network only)
    location = /nginx_status {
        stub_status;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
    }

    # ---- React single-page app: hashed assets are immutable, everything else falls back to index.html
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
